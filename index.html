html,body{margin:0;height:100%;background:var(--bg);overflow:hidden;touch-action:none;font-family:'Lilita One',Impact,'Arial Black',sans-serif;color:var(--ink);-webkit-user-select:none;user-select:none}
canvas{display:block;width:100%;height:100%}

button{font:inherit;font-size:24px;padding:12px 36px;border:0;border-radius:14px;background:var(--gold);color:#2a1450;box-shadow:0 5px 0 #b8861a}

#sup{position:fixed;right:calc(18px + env(safe-area-inset-right,0px));top:42%;width:74px;height:74px;border-radius:50%;padding:0;font-size:15px;background:#555;color:#bbb;box-shadow:none;display:none}
